name: Sync SharePoint master data

on:
  repository_dispatch:
    types: [sync-master-data]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and write public master data
        env:
          MASTER_DATA_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/master-data.json")
          payload = json.loads(os.environ["MASTER_DATA_PAYLOAD"])

          def clean(items, fields):
              output = []
              for item in items or []:
                  if not isinstance(item, dict):
                      continue
                  row = {field: str(item.get(field, "")).strip() for field in fields}
                  if any(row.values()):
                      output.append(row)
              return output

          # Os postos são exclusivamente os recebidos no evento do Power Automate.
          # Se a integração não os fornecer, a lista ficará vazia (sem exemplos fictícios).
          # A fonte dos postos e a coluna Posto da tabela de abastecimentos.
          # Aceita o conjunto de linhas do Excel em client_payload.abastecimentos.
          # Nao se inventam nem persistem postos que tenham desaparecido da fonte.
          abastecimentos = payload.get("abastecimentos", [])
          if not isinstance(abastecimentos, list):
              raise ValueError("abastecimentos deve ser uma lista de registos Excel")
          postos_unicos = {}
          for linha in abastecimentos:
              if not isinstance(linha, dict):
                  continue
              posto = str(linha.get("Posto") or linha.get("posto") or "").strip()
              if posto and posto.casefold() not in postos_unicos:
                  postos_unicos[posto.casefold()] = posto
          postos_ordenados = [
              {"nome": posto, "estado": "Activo"}
              for posto in sorted(postos_unicos.values(), key=str.casefold)
          ]


          # Preco mais recente valido por posto, obtido da propria tabela Excel.
          # Datas ISO e numeros seriais Excel sao aceites. Em empate, prevalece
          # o ultimo registo da lista recebida.
          from datetime import timedelta
          import re

          def data_iso(valor):
              if valor is None or valor == "":
                  return None
              if isinstance(valor, (int, float)):
                  try:
                      return (datetime(1899, 12, 30) + timedelta(days=float(valor))).strftime("%Y-%m-%d")
                  except (ValueError, OverflowError):
                      return None
              texto = str(valor).strip()
              if re.fullmatch(r"\d+(?:\.\d+)?", texto):
                  return data_iso(float(texto))
              try:
                  return datetime.fromisoformat(texto.replace("Z", "+00:00")).strftime("%Y-%m-%d")
              except ValueError:
                  pass
              for formato in ("%d/%m/%Y", "%d-%m-%Y", "%Y/%m/%d"):
                  try:
                      return datetime.strptime(texto, formato).strftime("%Y-%m-%d")
                  except ValueError:
                      continue
              return None

          # Correspondencia tolerante a acentos, maiusculas, espacos e
          # nomes escapados do conector Excel.
          import unicodedata
          def chave_normalizada(valor):
              texto = unicodedata.normalize("NFKD", str(valor))
              return "".join(c for c in texto if not unicodedata.combining(c)).lower().replace(" ", "").replace("_", "").replace("-", "")
          def ler_campo(linha, *nomes):
              if not isinstance(linha, dict):
                  return None
              valores = {chave_normalizada(k): v for k, v in linha.items()}
              for nome in nomes:
                  valor = valores.get(chave_normalizada(nome))
                  if valor is not None and str(valor).strip():
                      return valor
              return None
          def preco_numero(valor):
              if valor is None:
                  return None
              texto = str(valor).strip().replace("\\u00a0", " ")
              texto = re.sub(r"[^0-9,.\\-]", "", texto)
              if not texto:
                  return None
              if "," in texto and "." in texto:
                  texto = texto.replace(".", "").replace(",", ".") if texto.rfind(",") > texto.rfind(".") else texto.replace(",", "")
              elif "," in texto:
                  texto = texto.replace(",", ".")
              try:
                  numero = float(texto)
                  return numero if 0 < numero < 1000000 and numero != float("inf") else None
              except ValueError:
                  return None

          precos_recentes = {}
          for ordem, linha in enumerate(abastecimentos):
              if not isinstance(linha, dict):
                  continue
              posto = str(ler_campo(linha, "Posto") or "").strip()
              data = data_iso(ler_campo(linha, "Data"))
              preco = preco_numero(ler_campo(linha, "Valor Unitario", "Valor Unitário", "ValorUnitario", "PrecoUnitario", "Preço Unitário"))
              if not posto or not data or preco is None:
                  continue
              chave = posto.casefold()
              anterior = precos_recentes.get(chave)
              if anterior is None or (data, ordem) > (anterior["data"], anterior["ordem"]):
                  precos_recentes[chave] = {"nome": posto, "valor": preco, "data": data, "ordem": ordem}
          precos_publicos = [
              {"nome": preco["nome"], "valor": preco["valor"], "data": preco["data"]}
              for preco in sorted(precos_recentes.values(), key=lambda item: item["nome"].casefold())
          ]

          # Todos os preços distintos da coluna Valor Unitario em ordem de
          # data mais recente (sem repetição), não ordem numérica.
          datas_por_preco = {}
          for ordem, linha in enumerate(abastecimentos):
              if not isinstance(linha, dict):
                  continue
              preco = preco_numero(ler_campo(linha, "Valor Unitario", "Valor Unitário", "ValorUnitario", "PrecoUnitario", "Preço Unitário"))
              data = data_iso(ler_campo(linha, "Data"))
              if preco is None:
                  continue
              preco = round(preco, 2)
              marcador = (data or "", ordem)
              if preco not in datas_por_preco or marcador > datas_por_preco[preco]:
                  datas_por_preco[preco] = marcador
          precos_distintos = sorted(
              datas_por_preco,
              key=lambda preco: datas_por_preco[preco],
              reverse=True
          )

          # Diagnostico operacional: quantos registos chegaram da tabela
          # e quantos continham preco reconhecivel.
          total_com_valor = sum(
              1 for linha in abastecimentos
              if isinstance(linha, dict) and preco_numero(
                  ler_campo(linha, "Valor Unitario", "Valor Unitário", "ValorUnitario", "PrecoUnitario", "Preço Unitário")
              ) is not None
          )
          diagnostico = {
              "linhasRecebidas": len(abastecimentos),
              "linhasComValorUnitario": total_com_valor,
              "colunasDisponiveis": list(abastecimentos[0].keys()) if abastecimentos and isinstance(abastecimentos[0], dict) else []
          }

          public_data = {
              "actualizadoEm": payload.get("actualizadoEm") or datetime.now(timezone.utc).isoformat(),
              "viaturas": clean(payload.get("viaturas"), ["codigo", "estado"]),
              "postos": postos_ordenados,
              "precosPostos": precos_publicos,
              "precosDistintos": precos_distintos,
              "diagnosticoPrecos": diagnostico
          }

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(public_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish changes
        run: |
          git config user.name "SIR Data Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/master-data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Sync master data from SharePoint"
            git push
          fi

